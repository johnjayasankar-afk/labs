<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#09080c" />
    <title>Opening…</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #09080c;
        color: #f1ece4;
        font-family: "Schibsted Grotesk", "Avenir Next", sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        letter-spacing: 0.14em;
        font-size: 11px;
        text-transform: uppercase;
        color: rgba(241, 236, 228, 0.55);
      }
    </style>
  </head>
  <body>
    <main>Opening</main>
    <script>
      (function () {
        var map = {
          ridelens: "https://ride-lens2.vercel.app/",
          raildrop: "https://rail-drop3.vercel.app/",
          daylight: "https://daylight-app-wine.vercel.app/",
          agentfit: "https://agent-fit2.vercel.app/",
          cartonry: "https://cartonry.vercel.app/",
          keepfloor: "https://keep-floor.vercel.app/",
          pricing: "https://pricing-hub-seven.vercel.app/",
        };
        var key = location.pathname.replace(/\/+$/, "").split("/").pop();
        var dest = map[key];
        if (dest) location.replace(dest);
        else location.replace("/");
      })();
    </script>
  </body>
</html>
